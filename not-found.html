<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>404</title>
    <style>
        .container{
            text-align: center;
            margin: 80px auto;
        }

        .circle{
            width: 180px;
            height: 180px;
            border: 8px solid blue;
            border-radius: 50%;
            display: flex;
            justify-content: center;
            margin: auto;
            align-items: center;
            font-size: 50px;
            font-weight: bold;
            color: blue;
            border-bottom-color:white ;

            animation: rotate 1s ease infinite;
        }

        @keyframes rotate{
            from{
                transform: rotate(0deg);
            }
            to{
                transform: rotate(360deg);
            }
        }

        .circle p{
            color: black;
        }
        .container h2 {
            margin-top: 25px;
            font-size: 28px;
        }

        .conatiner p {
            color: gray;
            margin-top: 10px;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="circle">
            <p>404</p>
        </div>
        <h2>Page Not Found!</h2>
        <p>OOps! this page doesn't exist</p>
    </div>
</body>
</html>
